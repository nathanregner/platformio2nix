[env]
framework = picosdk
board = pico
board_build.core = earlephilhower

[env:pico-tar]
platform = https://github.com/maxgerhardt/platform-raspberrypi/archive/refs/tags/v1.4.0-gcc14-arduinopico460.tar.gz

[env:pico-git]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#v1.4.0-gcc14-arduinopico460
